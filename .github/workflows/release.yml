name: Release

on:
  push:
    tags:
      - "ES*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RESOURCES_REPO: ${{ vars.RESOURCES_REPO }}
  RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify configuration
        run: |
          : "${RESOURCES_REPO:?Repository variable RESOURCES_REPO is not set}"
          : "${RELEASE_BRANCH:?Repository variable RELEASE_BRANCH is not set}"

      - name: Install git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify tag is on the release branch
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"

      - name: Install build dependencies
        run: .github/scripts/install-build-deps.sh

      - name: Build
        run: |
          cmake .
          make -j"$(nproc)"
          make installer

      - name: Prepare release assets
        run: |
          owner="${RESOURCES_REPO%%/*}"
          name="${RESOURCES_REPO#*/}"
          mkdir dist
          cp build/installer.tar.gz build/setup-jshelper.tar.gz dist/
          sed -E \
            -e "s|^([[:space:]]*repo_owner=).*|\1\"${owner}\"|" \
            -e "s|^([[:space:]]*repo_name=).*|\1\"${name}\"|" \
            installer/setup.sh >dist/setup.sh
          grep -Eq "^[[:space:]]*repo_owner=\"${owner}\"$" dist/setup.sh
          grep -Eq "^[[:space:]]*repo_name=\"${name}\"$" dist/setup.sh
          (cd dist && sha256sum installer.tar.gz setup-jshelper.tar.gz setup.sh >SHA256SUMS)

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.RESOURCES_TOKEN }}
          TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$RESOURCES_REPO" \
            --title "$TAG" \
            --notes "Built from $SOURCE_COMMIT" \
            --prerelease
